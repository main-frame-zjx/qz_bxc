<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>青稚与白小纯 · 友情时间线（$edition）</title>
<style>$css</style>
</head>
<body id="top">
<a class="skip" href="#$first">跳到时间线</a>
<div class="cover">
<header class="mast wrap">
  <a class="brand" href="#top"><span class="brand-icon" aria-hidden="true"><i></i><i></i></span>双人纪事</a>
  <nav aria-label="主导航"><a href="#intro">人物导读</a><a href="#timeline">时间线 <span aria-hidden="true">↘</span></a></nav>
</header>
<section class="hero wrap" id="intro" aria-label="人物导读">
  <div class="hero-copy">
    <p class="eyebrow"><span></span>和平精英职业联赛 <i>/</i> 友情时间线</p>
    <h1>青稚<span class="and">与</span><span class="second-name">白小纯</span></h1>
    <p class="years">$years</p>
    <p class="intro">$intro</p>
    <div class="start"><a href="#$first">开始阅读 <span aria-hidden="true">↓</span></a><span>$edition · $count 条记录</span></div>
$portrait
  </div>
$reel
</section>
<div class="cover-foot wrap"><span>资料截至 <time>$asof</time></span><a href="#reading-notes">阅读说明 <span aria-hidden="true">↘</span></a></div>
</div>
<main class="layout wrap" id="timeline">
  <aside class="rail" aria-label="阅读导航">
    <details class="toc" open>
      <summary><span>阶段目录</span><span class="mobile-stage"></span></summary>
      <nav aria-label="阶段跳转">$nav</nav>
    </details>
    <div class="rail-meta"><span class="key-dot"></span>关系节点 <span class="key-square"></span>背景旁注</div>
  </aside>
  <div class="stream" role="region" aria-label="时间线正文">
    <div class="stream-label"><span>阅读时间线</span><span>$stages 个阶段 · $count 条记录</span></div>
    $chapters
$ending
    <section id="reading-notes" class="reading-notes"><h2>阅读说明</h2><p>$time_note</p><p>$ordering</p>
    $intro_sources
    </section>
  </div>
</main>
<footer class="foot wrap"><span>青稚与白小纯 · 友情时间线</span><a href="#top">回到页首 ↑</a></footer>
<dialog aria-labelledby="lightbox-title">
  <div class="dialog-head"><h2 id="lightbox-title">查看大图</h2>
    <div><button type="button" class="scale" aria-pressed="false">原尺寸</button>
    <button type="button" class="close" autofocus>关闭 <span aria-hidden="true">×</span></button></div>
  </div>
  <figure><div class="pan" role="region" aria-label="原尺寸图可滚动查看" tabindex="0"><img alt=""></div><figcaption></figcaption></figure>
</dialog>
<script>$js</script>
</body></html>

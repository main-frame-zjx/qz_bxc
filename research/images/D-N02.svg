<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><title>两栏分别呈现青稚对训练时间、白小纯对工资与道歉的回忆。</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="760" height="400" rx="0" fill="#f6f1e6" stroke="none" stroke-width="0"/><text x="38" y="54" font-size="32" font-weight="650" fill="#193d40" text-anchor="start">训练回忆</text><rect x="596" y="23" width="130" height="43" rx="21" fill="none" stroke="#47645c" stroke-width="1.5"/><text x="661" y="52" font-size="23" font-weight="550" fill="#47645c" text-anchor="middle">原创示意</text><path d="M37 84L723 84" fill="none" stroke="#e4e4d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="119" width="323" height="218" rx="13" fill="#fffbf2" stroke="#e4e4d6" stroke-width="2"/><rect x="42" y="146" width="7" height="50" rx="3" fill="#227b72" stroke="none" stroke-width="0"/><text x="69" y="175" font-size="36" font-weight="650" fill="#227b72" text-anchor="start">青稚记得</text><text x="69" y="240" font-size="28" font-weight="650" fill="#193d40" text-anchor="start">队友到点下班</text><text x="69" y="290" font-size="28" font-weight="650" fill="#193d40" text-anchor="start">自己开口说了想法</text><rect x="393" y="119" width="323" height="218" rx="13" fill="#fffbf2" stroke="#e4e4d6" stroke-width="2"/><rect x="393" y="146" width="7" height="50" rx="3" fill="#a64723" stroke="none" stroke-width="0"/><text x="420" y="175" font-size="36" font-weight="650" fill="#a64723" text-anchor="start">白小纯记得</text><text x="420" y="240" font-size="28" font-weight="650" fill="#193d40" text-anchor="start">当时要顾及工资</text><text x="420" y="290" font-size="28" font-weight="650" fill="#193d40" text-anchor="start">也在意被要求道歉</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><title>在徒步的假设问答里，青稚说先扶白小纯，白小纯笑了。</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="760" height="400" rx="0" fill="#f6f1e6" stroke="none" stroke-width="0"/><text x="38" y="54" font-size="32" font-weight="650" fill="#193d40" text-anchor="start">一道假设题</text><rect x="596" y="23" width="130" height="43" rx="21" fill="none" stroke="#47645c" stroke-width="1.5"/><text x="661" y="52" font-size="23" font-weight="550" fill="#47645c" text-anchor="middle">原创示意</text><path d="M37 84L723 84" fill="none" stroke="#e4e4d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M52 291l78 -114 45 62 39 -53 78 105" fill="none" stroke="#227b72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="221" y="177" font-size="62" font-weight="650" fill="#a64723" text-anchor="middle">？</text><text x="330" y="181" font-size="35" font-weight="650" fill="#193d40" text-anchor="start">假设徒步时先扶谁？</text><text x="330" y="241" font-size="32" font-weight="650" fill="#227b72" text-anchor="start">青稚先选白小纯</text><text x="330" y="295" font-size="29" font-weight="650" fill="#47645c" text-anchor="start">白小纯听后笑了</text></g></svg>
